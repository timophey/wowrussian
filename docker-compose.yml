services:
  redis:
    image: redis:7-alpine
    container_name: wowrussian_redis
    # Ports are not exposed to host - only accessible within Docker network
    # Uncomment if you need external access:
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - wowrussian_network

  # 168fz Checker Service (for enhanced foreign word detection)
  fz168:
    build:
      context: ./168fz
      dockerfile: Dockerfile
    container_name: wowrussian_fz168
    ports:
      - "8169:8000"
    volumes:
      - ./168fz/dictionaries/data:/app/dictionaries/data
      - ./168fz/dictionaries/user_data:/app/dictionaries/user_data
      - ./168fz/sync/cache:/app/sync/cache
      - ./168fz/config:/app/config
    environment:
      - ADMIN_KEY=${FZ168_ADMIN_KEY:-}
      - DEBUG=false
    networks:
      - wowrussian_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database (Recommended for production)
  postgres:
    image: postgres:15-alpine
    container_name: wowrussian_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-wowrussian}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wowrussian_password}
      - POSTGRES_DB=${POSTGRES_DB:-wowrussian}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Ports are not exposed to host - only accessible within Docker network
    # Uncomment if you need external access (e.g., for local development tools):
    # ports:
    #   - "5432:5432"
    networks:
      - wowrussian_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wowrussian}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MySQL/MariaDB Database (Alternative)
  mysql:
    image: mysql:8.0
    container_name: wowrussian_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-wowrussian}
      - MYSQL_USER=${MYSQL_USER:-wowrussian}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-wowrussian_password}
    volumes:
      - mysql_data:/var/lib/mysql
    # Ports are not exposed to host - only accessible within Docker network
    # Uncomment if you need external access (e.g., for local development tools):
    # ports:
    #   - "3306:3306"
    networks:
      - wowrussian_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wowrussian_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/app.db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_PATH=/app/storage
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-admin-secret-change-this}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:8000"]}
      # 168fz integration
      - USE_FZ168=${USE_FZ168:-True}
      - FZ168_URL=${FZ168_URL:-http://fz168:8000}
      # Home page tab order
      - TAB_ORDER=${TAB_ORDER:-site,text,url,file}
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    depends_on:
      - redis
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-keep-alive 120
    networks:
      - wowrussian_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wowrussian_celery
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/app.db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_PATH=/app/storage
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-admin-secret-change-this}
      - DEBUG=${DEBUG:-True}
      # 168fz integration
      - USE_FZ168=${USE_FZ168:-True}
      - FZ168_URL=${FZ168_URL:-http://fz168:8000}
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    depends_on:
      - redis
      - backend
      # Uncomment the database you want to use:
      - postgres
      # - mysql
      - fz168
    command: celery -A app.tasks worker --loglevel=info --concurrency=2
    networks:
      - wowrussian_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - LOGO_FILE=${LOGO_FILE:-logo-icon-text.svg}
    container_name: wowrussian_frontend
    environment:
      - LOGO_FILE=${LOGO_FILE:-logo-icon-text.svg}
      - GENERATE_SOURCEMAP=true
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - wowrussian_network

volumes:
  redis_data:
  postgres_data:
  mysql_data:
  dictionaries:

networks:
  wowrussian_network:
    driver: bridge